<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Pagina niet gevonden · Pandoppervlakte &amp; percelen</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 34'%3E%3Cpath d='M15 1 L28 6 V16 C28 25 22 30.5 15 33 C8 30.5 2 25 2 16 V6 Z' fill='%23b5541f' stroke='%231c2321'/%3E%3Ctext x='15' y='21' text-anchor='middle' font-family='monospace' font-size='13' font-weight='600' fill='white'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1c2321; --paper: #eef0ea; --panel: #ffffff; --line: #d7dbd0; --rust: #b5541f; --slate: #4a5a58; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
  main { max-width: 440px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 28px 26px; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--rust); margin: 0 0 4px; }
  h1 { font-size: 21px; font-weight: 600; line-height: 1.25; margin: 0 0 14px; }
  p { font-size: 14px; line-height: 1.55; color: var(--slate); margin: 0 0 18px; }
  a { color: var(--ink); font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Fout 404</p>
  <h1>Deze pagina bestaat niet</h1>
  <p>Het adres dat je opende is niet gevonden. Mogelijk is de link verouderd of verkeerd getypt.</p>
  <a href="/footprint_percelen/">Terug naar &ldquo;Klopt het perceel bij dit rijksmonument?&rdquo;</a>
</main>
</body>
</html>
